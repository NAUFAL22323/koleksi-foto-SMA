<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto eskul SMA</title>
    <style>
        /* Gaya dasar halaman */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        /* Mengatur susunan kotak foto agar rapi otomatis */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Gaya setiap kotak foto */
        .gallery-item {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        /* Efek sedikit membesar saat kursor diarahkan ke foto */
        .gallery-item:hover {
            transform: scale(1.03);
        }

        /* Mengatur agar ukuran foto pas di dalam kotak */
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Koleksi Foto SMA saya</h1>

    <div class="gallery-container">
        <!-- 
          PETUNJUK: 
          Ganti tulisan foto1.jpg, foto2.jpg, dll di bawah ini 
          sesuai dengan nama file foto asli Anda yang ada di dalam folder.
        -->
        <div class="gallery-item"><img src="https://i.ibb.co.com/FqD29FFq/KARATE.jpg" alt="Foto 1"></div>
        <div class="gallery-item"><img src="https://i.ibb.co.com/x8F6Rw9v/KARATE-1.jpg
" alt="Foto 2"></div>
        <div class="gallery-item"><img src="https://i.ibb.co.com/h1DfS1Xp/KARATE-2.jpg
" alt="Foto 3"></div>
        <div class="gallery-item"><img src="https://i.ibb.co.com/8LD9T6HS/KARATE-3.jpg" alt="Foto 4"></div>

    </div>
